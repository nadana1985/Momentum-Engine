# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR KRONOS V12 NICEGUI COMMAND CENTER
# Place in: /etc/nginx/sites-available/kronos-v12.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/kronos-v12.conf /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with your EC2 domain or Elastic IP

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Maximum payload size for artifact and telemetry requests
    client_max_body_size 50M;

    # NiceGUI Frontend & WebSocket Proxy
    location / {
        proxy_pass http://127.0.0.1:8056;
        proxy_http_version 1.1;

        # WebSocket connection upgrade headers (Mandatory for NiceGUI Vue/Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy client identity headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent premature WebSocket disconnection
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Buffering settings for real-time streaming
        proxy_buffering off;
        proxy_cache off;
    }

    # Optional: SSL configuration template (Certbot / Let's Encrypt)
    # To enable HTTPS:
    # 1. sudo apt-get install -y certbot python3-certbot-nginx
    # 2. sudo certbot --nginx -d your-domain.com
}
