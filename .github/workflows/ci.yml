name: V15 Production Test Suite & Integrity Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run V15 Core Integrity & Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas pyarrow scipy

      - name: Run V15 Integrity & Regression Gates
        run: |
          pytest -v tests/test_results_check.py tests/test_no_lookahead.py tests/test_errors_surface.py tests/test_file_format.py tests/test_ops_tape.py tests/test_oms_fills.py
